name: Clean obsolete website drafts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete files and this one-time workflow
        shell: python
        run: |
          import subprocess
          paths = ['home-v2.html', 'research-v2.html', 'teaching-v2.html', 'public-engagement-v2.html', 'about.html', 'book.html', 'publications.html', 'data', 'assets/images/profile/stanford-2024.jpg', 'assets/images/citations/data-8.png', 'assets/images/citations/data-9.png', 'assets/images/citations/data-2.png', 'assets/images/citations/data-3.png', 'assets/images/citations/data-1.png', 'assets/images/citations/data-4.png', 'assets/images/citations/data-5.png', 'assets/images/citations/data-7.png', 'assets/images/citations/data-6.png', 'assets/images/graphs/graphs-18.png', '.github/workflows/cleanup-website-drafts.yml']
          subprocess.run(['git', 'rm', '-r', '--ignore-unmatch', '--', *paths], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Remove obsolete website drafts and unused assets'], check=True)
          subprocess.run(['git', 'push'], check=True)
