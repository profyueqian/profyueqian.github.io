name: Organize website files once
on:
  push:
    paths:
      - '.github/workflows/organize-files.yml'
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move assets and update references
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          root=Path('.')
          moves={
           'portrait.jpg':'assets/images/profile/portrait.jpg',
           'book.jpg':'assets/images/book/book-cover.jpg',
           'cv.pdf':'assets/documents/cv.pdf',
           'style.css':'assets/css/style.css',
           'publication-record.json':'data/publication-record.json',
           'content.json':'data/content.json',
          }
          for p in root.glob('graphs-*.*'): moves[p.name]='assets/images/graphs/'+p.name
          for p in root.glob('data-*.png'): moves[p.name]='assets/images/citations/'+p.name
          for old,new in moves.items():
           p=root/old
           if p.exists():
            dest=root/new;dest.parent.mkdir(parents=True,exist_ok=True);p.rename(dest)
          for p in root.glob('*.html'):
           s=p.read_text()
           for old,new in moves.items():
            s=s.replace('"'+old+'"','"'+new+'"')
           p.write_text(s)
          p=root/'README.md';s=p.read_text()
          for old,new in moves.items(): s=s.replace('`'+old+'`','`'+new+'`')
          s += '''\n## File organization\n\n- HTML pages remain in the root for simple navigation.\n- `assets/images/profile/` — portrait.\n- `assets/images/book/` — book cover.\n- `assets/images/graphs/` — Facts in Graphs figures.\n- `assets/images/citations/` — citation images used in research resources.\n- `assets/documents/` — downloadable CV and future documents.\n- `assets/css/` — shared styles.\n- `data/` — publication bibliography and draft metadata.\n\nWhen replacing an image, keep its filename to avoid changing page links.\n'''
          p.write_text(s)
          for p in root.glob('*.html'):
           for url in re.findall(r'(?:src|href)="([^"]+)"',p.read_text()):
            if url.startswith(('https:','http:','#','mailto:')):continue
            assert (root/url.split('#')[0]).exists(),(str(p),url)
          
          Path('.github/workflows/organize-files.yml').unlink(missing_ok=True)
          PYTHON
      - name: Commit organization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize website assets and update page paths"
          git push
